server:
  port: ${PAYMENT_SERVER_PORT:8081}

spring:
  application:
    name: mdyaipay-payment
  datasource:
    url: ${PAYMENT_JDBC_URL:jdbc:mysql://127.0.0.1:3306/mdyaipay_payment?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
    username: ${PAYMENT_JDBC_USER:root}
    password: ${PAYMENT_JDBC_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 与 InnoDB 表（payment_order 等）上 @Transactional(READ_COMMITTED) 一致
      transaction-isolation: TRANSACTION_READ_COMMITTED
      maximum-pool-size: ${PAYMENT_HIKARI_MAXIMUM_POOL_SIZE:20}

mdyaipay:
  sentinel:
    enabled: ${MDYAIPAY_SENTINEL_ENABLED:true}
    dashboard: ${MDYAIPAY_SENTINEL_DASHBOARD:127.0.0.1:8858}
    transport-port: ${MDYAIPAY_SENTINEL_TRANSPORT_PORT:8719}
    seed-local-rules-from-ratelimit: true
  ratelimit:
    enabled: ${MDYAIPAY_RATELIMIT_ENABLED:true}
    backend: ${MDYAIPAY_RATELIMIT_BACKEND:redisson}
    fail-open: ${MDYAIPAY_RATELIMIT_FAIL_OPEN:false}
    redis:
      uri: ${MDYAIPAY_RATELIMIT_REDIS_URI:redis://127.0.0.1:6379}
      timeout: 200ms
    dubbo:
      enabled: true
    nacos:
      enabled: ${MDYAIPAY_RATELIMIT_NACOS_ENABLED:false}
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      group: ${NACOS_CONFIG_GROUP:DEFAULT_GROUP}
    default-policy:
      algorithm: SLIDING_WINDOW_COUNTER
      limit: 20
      window: 1s
    rules:
      # PaymentGatewayFacade 服务端 Dubbo：全接口 20/s（按接口维度）
      - id: payment-gateway-facade-provider
        match:
          dubbo-side: provider
          dubbo-service: com.mdyaipay.payment.api.gateway.PaymentGatewayFacade
        policy:
          algorithm: SLIDING_WINDOW_COUNTER
          limit: 20
          window: 1s
        key-resolvers: [dubboService]
  trace:
    http:
      log-entry-on-complete: true
    slice:
      enabled: true
      log-on-complete: true
    dubbo:
      enabled: true
  mybatis:
    sql-perf:
      enabled: true
      slow-threshold-millis: 0
      include-trace-id: true
  timetrace:
    enabled: true
    report-sink: log4j
    log-file: logs/timetrace.log

logging:
  file:
    # 由 log4j2-spring.xml 写入；启动时勿再对该路径 shell 重定向（>>），否则每条日志会重复
    name: logs/mdyaipay-payment.log

payment:
  id:
    worker-id: ${PAYMENT_ID_WORKER_ID:2}
    datacenter-id: ${PAYMENT_ID_DATACENTER_ID:1}
  jdbc:
    init-schema: ${PAYMENT_JDBC_INIT_SCHEMA:true}
    reset-schema: ${PAYMENT_JDBC_RESET_SCHEMA:false}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-handlers-package: com.mdyaipay.payment.repository.mybatis
  configuration:
    map-underscore-to-camel-case: true

dubbo:
  application:
    name: mdyaipay-payment
    qos-enable: false
  protocol:
    name: dubbo
    port: ${DUBBO_PORT:20881}
    host: 0.0.0.0
  registry:
    address: ${DUBBO_REGISTRY_ADDRESS:zookeeper://127.0.0.1:2181}
  metrics:
    enable: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
  endpoint:
    health:
      probes:
        enabled: true
