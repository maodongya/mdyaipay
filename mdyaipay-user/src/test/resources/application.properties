spring.datasource.url=jdbc:h2:mem:mdyaipay_user;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

user.jdbc.init-schema=true
user.mq.enabled=false

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-handlers-package=com.mdyaipay.user.dao.support.mybatis
mybatis.configuration.map-underscore-to-camel-case=true

dubbo.application.qos-enable=false
dubbo.registry.address=N/A

spring.autoconfigure.exclude=org.apache.rocketmq.spring.autoconfigure.RocketMQAutoConfiguration
