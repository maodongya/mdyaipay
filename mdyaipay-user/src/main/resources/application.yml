server:
  port: ${USER_SERVER_PORT:8082}

spring:
  application:
    name: mdyaipay-user
  datasource:
    url: ${USER_JDBC_URL:jdbc:mysql://127.0.0.1:3306/mdyaipay_user?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
    username: ${USER_JDBC_USER:root}
    password: ${USER_JDBC_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

user:
  id:
    worker-id: ${USER_ID_WORKER_ID:3}
    datacenter-id: ${USER_ID_DATACENTER_ID:1}
  jdbc:
    init-schema: ${USER_JDBC_INIT_SCHEMA:true}
    reset-schema: ${USER_JDBC_RESET_SCHEMA:false}
  merchant:
    sign:
      max-skew-seconds: ${USER_MERCHANT_SIGN_MAX_SKEW:300}
  crypto:
    aes-key: ${USER_AES_KEY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
  mq:
    enabled: ${USER_MQ_ENABLED:false}
    outbox-relay-enabled: true
    outbox-relay-interval-ms: 5000
    merchant-topic: MDYAIPAY_USER_MERCHANT

mdyaipay:
  ratelimit:
    enabled: ${MDYAIPAY_RATELIMIT_ENABLED:true}
    backend: ${MDYAIPAY_RATELIMIT_BACKEND:redisson}
    fail-open: ${MDYAIPAY_RATELIMIT_FAIL_OPEN:false}
    redis:
      uri: ${MDYAIPAY_RATELIMIT_REDIS_URI:redis://127.0.0.1:6379}
      timeout: 200ms
    dubbo:
      enabled: true
    default-policy:
      algorithm: SLIDING_WINDOW_COUNTER
      limit: 20
      window: 1s
    rules:
      - id: user-merchant-gateway-facade-provider
        match:
          dubbo-side: provider
          dubbo-service: com.mdyaipay.user.api.merchant.gateway.MerchantGatewayFacade
        policy:
          algorithm: SLIDING_WINDOW_COUNTER
          limit: 20
          window: 1s
        key-resolvers: [dubboService]
  trace:
    http:
      log-entry-on-complete: true
    slice:
      enabled: true
      log-on-complete: true
    dubbo:
      enabled: true
  mybatis:
    sql-perf:
      enabled: true
      slow-threshold-millis: 0
      include-trace-id: true

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-handlers-package: com.mdyaipay.user.dao.support.mybatis
  configuration:
    map-underscore-to-camel-case: true

dubbo:
  application:
    name: mdyaipay-user
    qos-enable: false
  protocol:
    name: tri
    port: ${DUBBO_PORT:20882}
  registry:
    address: ${DUBBO_REGISTRY_ADDRESS:zookeeper://127.0.0.1:2181}

rocketmq:
  name-server: ${ROCKETMQ_NAMESRV:127.0.0.1:9876}
  producer:
    group: mdyaipay-user-producer

logging:
  file:
    # 由 log4j2-spring.xml 写入；启动时勿再对该路径 shell 重定向（>>），否则每条日志会重复
    name: logs/mdyaipay-user.log

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
