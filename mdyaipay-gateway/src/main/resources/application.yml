server:
  port: ${MDYAIPAY_GATEWAY_PORT:8041}

mdyaipay:
  sentinel:
    enabled: ${MDYAIPAY_SENTINEL_ENABLED:true}
    dashboard: ${MDYAIPAY_SENTINEL_DASHBOARD:127.0.0.1:8858}
    transport-port: ${MDYAIPAY_SENTINEL_TRANSPORT_PORT:8719}
    seed-local-rules-from-ratelimit: true
  trace:
    http:
      log-entry-on-complete: true
      propagate-response-header: true
    slice:
      enabled: true
      nested-spring-beans: false
      log-on-complete: true
    dubbo:
      enabled: true
  ratelimit:
    enabled: ${MDYAIPAY_RATELIMIT_ENABLED:true}
    backend: ${MDYAIPAY_RATELIMIT_BACKEND:redisson}
    fail-open: ${MDYAIPAY_RATELIMIT_FAIL_OPEN:false}
    redis:
      uri: ${MDYAIPAY_RATELIMIT_REDIS_URI:redis://127.0.0.1:6379}
      timeout: 200ms
    dubbo:
      enabled: true
    nacos:
      enabled: ${MDYAIPAY_RATELIMIT_NACOS_ENABLED:false}
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      group: ${NACOS_CONFIG_GROUP:DEFAULT_GROUP}
    default-policy:
      algorithm: SLIDING_WINDOW_LOG
      limit: 20
      window: 1s
    rules:
      # 支付（收单）：全平台每路径 20 次/秒（滑动窗口日志）
      - id: gateway-payment-collect
        match:
          path: /api/v1/payments/collect
          methods: [POST]
        policy:
          algorithm: SLIDING_WINDOW_LOG
          limit: 20
          window: 1s
        key-resolvers: [path]
      # 代扣（POST /api/v1/withholds）；若口语「提现」指出款见 gateway-payout
      - id: gateway-withhold
        match:
          path: /api/v1/withholds
          methods: [POST]
        policy:
          algorithm: SLIDING_WINDOW_LOG
          limit: 20
          window: 1s
        key-resolvers: [path]
      # 代付 / 商户提现出款（POST /api/v1/payouts）
      - id: gateway-payout
        match:
          path: /api/v1/payouts
          methods: [POST]
        policy:
          algorithm: SLIDING_WINDOW_LOG
          limit: 20
          window: 1s
        key-resolvers: [path]
      # 调用 payment Dubbo：Consumer 侧 20/s（与 PaymentGatewayFacade 对齐）
      - id: gateway-payment-facade-consumer
        match:
          dubbo-side: consumer
          dubbo-service: com.mdyaipay.payment.api.gateway.PaymentGatewayFacade
        policy:
          algorithm: SLIDING_WINDOW_COUNTER
          limit: 20
          window: 1s
        key-resolvers: [dubboService]
      # 调用 user Dubbo：Consumer 侧 20/s（MerchantGatewayFacade 验签凭证）
      - id: gateway-user-merchant-gateway-facade-consumer
        match:
          dubbo-side: consumer
          dubbo-service: com.mdyaipay.user.api.merchant.gateway.MerchantGatewayFacade
        policy:
          algorithm: SLIDING_WINDOW_COUNTER
          limit: 20
          window: 1s
        key-resolvers: [dubboService]
  gateway:
    user-base-url: ${USER_BASE_URL:}
    # 留空则 gateway→payment 仅 Dubbo（Consumer 限流生效）；压测需 HTTP 时可设 PAYMENT_BASE_URL
    payment-base-url: ${PAYMENT_BASE_URL:}
    payment-dubbo-url: ${PAYMENT_DUBBO_URL:}

spring:
  application:
    name: mdyaipay-gateway
  cloud:
    gateway:
      # 业务由 GlobalFilter + Dubbo 处理，无真实下游；须声明路由否则 SCG 直接 404
      routes:
        - id: mdyaipay-open-api
          uri: no://op
          predicates:
            - Path=/api/v1/**
      httpclient:
        connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:3000}
        response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:10s}
      default-filters:
        - AddResponseHeader=X-Gateway, mdyaipay
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: ${GATEWAY_ALLOWED_ORIGINS:*}
            allowedMethods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
            allowedHeaders: "*"
            allowCredentials: false
      metrics:
        enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
  endpoint:
    health:
      probes:
        enabled: true

logging:
  file:
    # 由 log4j2-spring.xml 写入；启动时勿再对该路径 shell 重定向（>>），否则每条日志会重复
    name: logs/mdyaipay-gateway.log
  level:
    org.springframework.cloud.gateway: INFO

dubbo:
  application:
    name: mdyaipay-gateway
    qos-enable: false
  registry:
    address: ${DUBBO_REGISTRY_ADDRESS:zookeeper://127.0.0.1:2181}
  consumer:
    check: false
    timeout: 30000
    enable-connectivity-check: false
