server:
  port: ${MDYAIPAY_GATEWAY_PORT:8041}

mdyaipay:
  trace:
    http:
      log-entry-on-complete: true
      propagate-response-header: true
    slice:
      enabled: true
      nested-spring-beans: false
      log-on-complete: true
    dubbo:
      enabled: true
  gateway:
    user-base-url: ${USER_BASE_URL:http://127.0.0.1:8082}
    # 本地压测走 payment 内网 HTTP；生产留空并依赖 Dubbo
    payment-base-url: ${PAYMENT_BASE_URL:http://127.0.0.1:8081}
    payment-dubbo-url: ${PAYMENT_DUBBO_URL:}

spring:
  application:
    name: mdyaipay-gateway
  cloud:
    gateway:
      # 业务由 GlobalFilter + Dubbo 处理，无真实下游；须声明路由否则 SCG 直接 404
      routes:
        - id: mdyaipay-open-api
          uri: no://op
          predicates:
            - Path=/api/v1/**
      httpclient:
        connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:3000}
        response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:10s}
      default-filters:
        - AddResponseHeader=X-Gateway, mdyaipay
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: ${GATEWAY_ALLOWED_ORIGINS:*}
            allowedMethods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
            allowedHeaders: "*"
            allowCredentials: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true

logging:
  file:
    # 由 log4j2-spring.xml 写入；启动时勿再对该路径 shell 重定向（>>），否则每条日志会重复
    name: logs/mdyaipay-gateway.log
  level:
    org.springframework.cloud.gateway: INFO

dubbo:
  application:
    name: mdyaipay-gateway
    qos-enable: false
  registry:
    address: ${DUBBO_REGISTRY_ADDRESS:zookeeper://127.0.0.1:2181}
  consumer:
    check: false
    timeout: 30000
    enable-connectivity-check: false
