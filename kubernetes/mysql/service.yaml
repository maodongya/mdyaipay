apiVersion: v1
kind: Service
metadata:
  name: mysql8-headless
  namespace: mdyaipay-infra
  labels:
    app.kubernetes.io/name: mysql8
spec:
  clusterIP: None
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
  selector:
    app.kubernetes.io/name: mysql8
---
apiVersion: v1
kind: Service
metadata:
  name: mysql8
  namespace: mdyaipay-infra
  labels:
    app.kubernetes.io/name: mysql8
  annotations:
    # Docker Desktop：LoadBalancer 映射为 localhost:3306，供宿主机与 host.docker.internal 访问
    mdyaipay.dev/exposure: docker-desktop-loadbalancer
spec:
  type: LoadBalancer
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
  selector:
    app.kubernetes.io/name: mysql8
