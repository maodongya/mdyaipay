apiVersion: v1
kind: Service
metadata:
  name: redis7-headless
  namespace: mdyaipay-infra
  labels:
    app.kubernetes.io/name: redis7
spec:
  clusterIP: None
  ports:
    - name: redis
      port: 6379
      targetPort: redis
  selector:
    app.kubernetes.io/name: redis7
---
apiVersion: v1
kind: Service
metadata:
  name: redis7
  namespace: mdyaipay-infra
  labels:
    app.kubernetes.io/name: redis7
  annotations:
    mdyaipay.dev/exposure: docker-desktop-loadbalancer
spec:
  type: LoadBalancer
  ports:
    - name: redis
      port: 6379
      targetPort: redis
  selector:
    app.kubernetes.io/name: redis7
