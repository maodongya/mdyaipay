apiVersion: v1
kind: Service
metadata:
  name: nacos
  labels:
    app.kubernetes.io/name: nacos
    app.kubernetes.io/part-of: mdyaipay
    app.kubernetes.io/component: infra
  annotations:
    mdyaipay.dev/exposure: docker-desktop-loadbalancer
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 8848
      targetPort: http
    - name: grpc
      port: 9848
      targetPort: grpc
  selector:
    app.kubernetes.io/name: nacos
