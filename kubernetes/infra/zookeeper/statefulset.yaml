apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zookeeper
  labels:
    app.kubernetes.io/name: zookeeper
spec:
  serviceName: zookeeper-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: zookeeper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zookeeper
        app.kubernetes.io/part-of: mdyaipay
        app.kubernetes.io/component: infra
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: zookeeper
          image: zookeeper:3.9.3
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -ec
            - |
              ORD="${HOSTNAME##*-}"
              export ZOO_MY_ID="$((ORD + 1))"
              exec /docker-entrypoint.sh zkServer.sh start-foreground
          ports:
            - name: client
              containerPort: 2181
            - name: quorum
              containerPort: 2888
            - name: election
              containerPort: 3888
          envFrom:
            - configMapRef:
                name: zookeeper-env
          resources:
            requests:
              memory: 192Mi
              cpu: 100m
            limits:
              memory: 384Mi
              cpu: "1"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: datalog
              mountPath: /datalog
          readinessProbe:
            exec:
              command:
                - bash
                - -ec
                - 'echo ruok | nc -w 2 127.0.0.1 2181 | grep -q imok'
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 18
          livenessProbe:
            exec:
              command:
                - bash
                - -ec
                - 'echo ruok | nc -w 2 127.0.0.1 2181 | grep -q imok'
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: zookeeper
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: hostpath
        resources:
          requests:
            storage: 2Gi
    - metadata:
        name: datalog
        labels:
          app.kubernetes.io/name: zookeeper
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: hostpath
        resources:
          requests:
            storage: 2Gi
