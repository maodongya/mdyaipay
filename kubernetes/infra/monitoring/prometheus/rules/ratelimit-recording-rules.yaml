# mdyaipay 网关限流 SLO — Prometheus Recording Rules
# application 与 job 双匹配：兼容 scrape 注入标签与 Micrometer commonTags。
groups:
  - name: mdyaipay_ratelimit_slo
    interval: 30s
    rules:
      - record: mdyaipay:gateway:http_requests:rate5m
        expr: |
          sum(rate(http_server_requests_seconds_count{application="mdyaipay-gateway"}[5m]))
          or sum(rate(http_server_requests_seconds_count{job="mdyaipay-gateway"}[5m]))

      - record: mdyaipay:gateway:http_5xx:rate5m
        expr: |
          sum(rate(http_server_requests_seconds_count{application="mdyaipay-gateway",status=~"5.."}[5m]))
          or sum(rate(http_server_requests_seconds_count{job="mdyaipay-gateway",status=~"5.."}[5m]))

      - record: mdyaipay:gateway:http_429:rate5m
        expr: |
          sum(rate(http_server_requests_seconds_count{application="mdyaipay-gateway",status="429"}[5m]))
          or sum(rate(http_server_requests_seconds_count{job="mdyaipay-gateway",status="429"}[5m]))

      - record: mdyaipay:gateway:http_ok_or_429:rate5m
        expr: |
          sum(rate(http_server_requests_seconds_count{application="mdyaipay-gateway",status=~"2..|429"}[5m]))
          or sum(rate(http_server_requests_seconds_count{job="mdyaipay-gateway",status=~"2..|429"}[5m]))

      - record: mdyaipay:gateway:http_5xx_ratio:rate5m
        expr: |
          mdyaipay:gateway:http_5xx:rate5m
          /
          clamp_min(mdyaipay:gateway:http_requests:rate5m, 1e-9)

      - record: mdyaipay:ratelimit:decisions:rate5m
        expr: |
          sum(rate(mdyaipay_ratelimit_decisions_total{application="mdyaipay-gateway"}[5m])) by (rule_id, outcome)
          or sum(rate(mdyaipay_ratelimit_decisions_total{job="mdyaipay-gateway"}[5m])) by (rule_id, outcome)

      - record: mdyaipay:ratelimit:denied:rate5m
        expr: |
          sum(rate(mdyaipay_ratelimit_decisions_total{application="mdyaipay-gateway",outcome="denied"}[5m])) by (rule_id)
          or sum(rate(mdyaipay_ratelimit_decisions_total{job="mdyaipay-gateway",outcome="denied"}[5m])) by (rule_id)

      - record: mdyaipay:ratelimit:backend_error:rate5m
        expr: |
          sum(rate(mdyaipay_ratelimit_decisions_total{application="mdyaipay-gateway",outcome="backend_error"}[5m]))
          or sum(rate(mdyaipay_ratelimit_decisions_total{job="mdyaipay-gateway",outcome="backend_error"}[5m]))

      - record: mdyaipay:ratelimit:denied_ratio:rate5m
        expr: |
          (
            sum(rate(mdyaipay_ratelimit_decisions_total{application="mdyaipay-gateway",outcome="denied"}[5m]))
            or sum(rate(mdyaipay_ratelimit_decisions_total{job="mdyaipay-gateway",outcome="denied"}[5m]))
          )
          /
          clamp_min(
            (
              sum(rate(mdyaipay_ratelimit_decisions_total{application="mdyaipay-gateway",outcome=~"allowed|denied|backend_error"}[5m]))
              or sum(rate(mdyaipay_ratelimit_decisions_total{job="mdyaipay-gateway",outcome=~"allowed|denied|backend_error"}[5m]))
            ),
            1e-9)

  - name: mdyaipay_ratelimit_user
    interval: 30s
    rules:
      - record: mdyaipay:user:http_requests:rate5m
        expr: |
          sum(rate(http_server_requests_seconds_count{application="mdyaipay-user"}[5m]))
          or sum(rate(http_server_requests_seconds_count{job="mdyaipay-user"}[5m]))

      - record: mdyaipay:user:ratelimit:decisions:rate5m
        expr: |
          sum(rate(mdyaipay_ratelimit_decisions_total{application="mdyaipay-user"}[5m])) by (rule_id, outcome)
          or sum(rate(mdyaipay_ratelimit_decisions_total{job="mdyaipay-user"}[5m])) by (rule_id, outcome)

      - record: mdyaipay:user:ratelimit:denied:rate5m
        expr: |
          sum(rate(mdyaipay_ratelimit_decisions_total{application="mdyaipay-user",outcome="denied"}[5m])) by (rule_id)
          or sum(rate(mdyaipay_ratelimit_decisions_total{job="mdyaipay-user",outcome="denied"}[5m])) by (rule_id)

      - record: mdyaipay:user:ratelimit:backend_error:rate5m
        expr: |
          sum(rate(mdyaipay_ratelimit_decisions_total{application="mdyaipay-user",outcome="backend_error"}[5m]))
          or sum(rate(mdyaipay_ratelimit_decisions_total{job="mdyaipay-user",outcome="backend_error"}[5m]))

  - name: mdyaipay_ratelimit_payment
    interval: 30s
    rules:
      - record: mdyaipay:payment:http_requests:rate5m
        expr: |
          sum(rate(http_server_requests_seconds_count{application="mdyaipay-payment"}[5m]))
          or sum(rate(http_server_requests_seconds_count{job="mdyaipay-payment"}[5m]))

      - record: mdyaipay:payment:ratelimit:decisions:rate5m
        expr: |
          sum(rate(mdyaipay_ratelimit_decisions_total{application="mdyaipay-payment"}[5m])) by (rule_id, outcome)
          or sum(rate(mdyaipay_ratelimit_decisions_total{job="mdyaipay-payment"}[5m])) by (rule_id, outcome)

      - record: mdyaipay:payment:ratelimit:denied:rate5m
        expr: |
          sum(rate(mdyaipay_ratelimit_decisions_total{application="mdyaipay-payment",outcome="denied"}[5m])) by (rule_id)
          or sum(rate(mdyaipay_ratelimit_decisions_total{job="mdyaipay-payment",outcome="denied"}[5m])) by (rule_id)

      - record: mdyaipay:payment:ratelimit:backend_error:rate5m
        expr: |
          sum(rate(mdyaipay_ratelimit_decisions_total{application="mdyaipay-payment",outcome="backend_error"}[5m]))
          or sum(rate(mdyaipay_ratelimit_decisions_total{job="mdyaipay-payment",outcome="backend_error"}[5m]))
