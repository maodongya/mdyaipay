apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: mdyaipay
    app.kubernetes.io/component: infra
data:
  mdyaipay.yaml: |
    apiVersion: 1
    providers:
      - name: mdyaipay
        orgId: 1
        folder: mdyaipay
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/mdyaipay
