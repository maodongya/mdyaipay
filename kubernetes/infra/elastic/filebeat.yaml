apiVersion: v1
kind: ServiceAccount
metadata:
  name: filebeat
  labels:
    app.kubernetes.io/name: filebeat
    app.kubernetes.io/part-of: mdyaipay
    app.kubernetes.io/component: logging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mdyaipay-filebeat
  labels:
    app.kubernetes.io/name: filebeat
    app.kubernetes.io/part-of: mdyaipay
    app.kubernetes.io/component: logging
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mdyaipay-filebeat
  labels:
    app.kubernetes.io/name: filebeat
    app.kubernetes.io/part-of: mdyaipay
    app.kubernetes.io/component: logging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mdyaipay-filebeat
subjects:
  - kind: ServiceAccount
    name: filebeat
    namespace: mdyaipay-infra
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-config
  labels:
    app.kubernetes.io/name: filebeat
    app.kubernetes.io/part-of: mdyaipay
    app.kubernetes.io/component: logging
data:
  filebeat.yml: |
    filebeat.inputs:
      - type: container
        paths:
          - /var/log/containers/*.log
        processors:
          - add_kubernetes_metadata:
              host: ${NODE_NAME}
              matchers:
                - logs_path:
                    logs_path: "/var/log/containers/"
          - drop_event:
              when:
                not:
                  equals:
                    kubernetes.namespace: "mdyaipay"
          - decode_json_fields:
              fields: ["message"]
              target: ""
              overwrite_keys: true
              add_error_key: true
          - script:
              lang: javascript
              source: >
                function process(event) {
                  var name = event.Get("service.name");
                  if (!name) {
                    var container = event.Get("kubernetes.container.name") || "";
                    var mapping = {
                      "gateway": "mdyaipay-gateway",
                      "user": "mdyaipay-user",
                      "payment": "mdyaipay-payment",
                      "accounting": "mdyaipay-accounting",
                      "finance": "mdyaipay-finance",
                      "finance-gateway": "mdyaipay-finance-gateway",
                      "finance-mock": "mdyaipay-finance-mock",
                      "heartbeat": "mdyaipay-log-pipeline"
                    };
                    name = mapping[container];
                    if (name) {
                      event.Put("service.name", name);
                    }
                  }
                  if (!name) {
                    event.Cancel();
                    return;
                  }
                  var message = event.Get("message") || "";
                  var action = message.match(/event=([A-Za-z0-9_]+)/);
                  if (action) {
                    event.Put("event.action", action[1]);
                  }
                  var outcome = message.match(/outcome=([A-Za-z0-9_]+)/);
                  if (outcome) {
                    event.Put("event.outcome", outcome[1]);
                  }
                }
    output.elasticsearch:
      hosts: ["http://elasticsearch.mdyaipay-infra.svc.cluster.local:9200"]
      index: "logs-mdyaipay-%{[service.name]}-%{+yyyy.MM.dd}"
    setup.ilm.enabled: false
    setup.template.enabled: false
    logging.metrics.enabled: false
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: filebeat
  labels:
    app.kubernetes.io/name: filebeat
    app.kubernetes.io/part-of: mdyaipay
    app.kubernetes.io/component: logging
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: filebeat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: filebeat
        app.kubernetes.io/part-of: mdyaipay
        app.kubernetes.io/component: logging
    spec:
      serviceAccountName: filebeat
      terminationGracePeriodSeconds: 30
      containers:
        - name: filebeat
          image: docker.elastic.co/beats/filebeat:8.19.4
          imagePullPolicy: IfNotPresent
          args: ["-c", "/etc/filebeat.yml", "-e"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 384Mi
              cpu: "1"
          volumeMounts:
            - name: config
              mountPath: /etc/filebeat.yml
              subPath: filebeat.yml
              readOnly: true
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: filebeat-config
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
