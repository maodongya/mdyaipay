apiVersion: batch/v1
kind: Job
metadata:
  name: kibana-alert-bootstrap
  labels:
    app.kubernetes.io/name: kibana-alert-bootstrap
    app.kubernetes.io/part-of: mdyaipay
    app.kubernetes.io/component: logging
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kibana-alert-bootstrap
        app.kubernetes.io/part-of: mdyaipay
        app.kubernetes.io/component: logging
    spec:
      restartPolicy: Never
      containers:
        - name: bootstrap
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python3", "/config/bootstrap_alerts.py"]
          env:
            - name: ELASTICSEARCH_URL
              value: http://elasticsearch.mdyaipay-infra.svc.cluster.local:9200
            - name: KIBANA_URL
              value: http://kibana.mdyaipay-infra.svc.cluster.local:5601
            - name: ALERT_CATALOG
              value: /config/alert-catalog.json
            - name: ALERT_PROFILE
              valueFrom:
                configMapKeyRef:
                  name: kibana-alert-profile
                  key: ALERT_PROFILE
                  optional: true
            - name: WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: mdyaipay-kibana-secrets
                  key: WEBHOOK_URL
                  optional: true
          volumeMounts:
            - name: bootstrap
              mountPath: /config
              readOnly: true
          resources:
            requests:
              memory: 64Mi
              cpu: 25m
            limits:
              memory: 128Mi
              cpu: "1"
      volumes:
        - name: bootstrap
          configMap:
            name: kibana-alert-bootstrap
