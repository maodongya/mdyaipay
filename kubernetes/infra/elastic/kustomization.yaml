apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mdyaipay-infra

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: kibana-alert-bootstrap
    files:
      - bootstrap/bootstrap_alerts.py
      - bootstrap/alert-catalog.json

resources:
  - elasticsearch.yaml
  - kibana.yaml
  - filebeat.yaml
  - bootstrap-job.yaml
