apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-dashboard
  namespace: mdyaipay
  labels:
    app.kubernetes.io/name: sentinel-dashboard
    app.kubernetes.io/part-of: mdyaipay
    app.kubernetes.io/component: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sentinel-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinel-dashboard
        app.kubernetes.io/part-of: mdyaipay
        app.kubernetes.io/component: app
    spec:
      containers:
        - name: sentinel
          image: mdyaipay-sentinel-dashboard:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8858
          resources:
            requests:
              memory: 384Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: "1"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-dashboard
  namespace: mdyaipay
  labels:
    app.kubernetes.io/name: sentinel-dashboard
  annotations:
    mdyaipay.dev/exposure: docker-desktop-loadbalancer
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 8858
      targetPort: http
  selector:
    app.kubernetes.io/name: sentinel-dashboard
