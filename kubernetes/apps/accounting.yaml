apiVersion: apps/v1
kind: Deployment
metadata:
  name: mdyaipay-accounting-1
  namespace: mdyaipay
  labels:
    app.kubernetes.io/name: mdyaipay-accounting
    app.kubernetes.io/instance: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mdyaipay-accounting
      app.kubernetes.io/instance: "1"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mdyaipay-accounting
        app.kubernetes.io/instance: "1"
        app.kubernetes.io/part-of: mdyaipay
        app.kubernetes.io/component: app
    spec:
      containers:
        - name: accounting
          image: mdyaipay-accounting:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8083
            - name: dubbo
              containerPort: 20883
          env:
            - name: ACCOUNTING_SERVER_PORT
              value: "8083"
            - name: ACCOUNTING_JDBC_URL
              value: jdbc:mysql://mysql8.mdyaipay-infra.svc.cluster.local:3306/mdyaipay_accounting?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
            - name: ACCOUNTING_JDBC_USER
              value: root
            - name: ACCOUNTING_JDBC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mdyaipay-jdbc
                  key: ACCOUNTING_JDBC_PASSWORD
            - name: ACCOUNTING_MQ_ENABLED
              value: "false"
            - name: SPRING_AUTOCONFIGURE_EXCLUDE
              value: org.apache.rocketmq.spring.autoconfigure.RocketMQAutoConfiguration
            - name: DUBBO_PORT
              value: "20883"
            - name: DUBBO_REGISTRY_ADDRESS
              value: zookeeper://zookeeper.mdyaipay-infra.svc.cluster.local:2181
            - name: DUBBO_IP_TO_REGISTRY
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: DUBBO_PROTOCOL_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: MDYAIPAY_SENTINEL_DASHBOARD
              value: sentinel-dashboard.mdyaipay.svc.cluster.local:8858
            - name: ACCOUNTING_ID_WORKER_ID
              value: "4"
            - name: MDYAIPAY_SENTINEL_TRANSPORT_PORT
              value: "8725"
          resources:
            requests:
              memory: 384Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: "1"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 90
            periodSeconds: 5
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 180
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: mdyaipay-accounting-1
  namespace: mdyaipay
  annotations:
    mdyaipay.dev/exposure: docker-desktop-loadbalancer
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 8085
      targetPort: http
    - name: dubbo
      port: 20885
      targetPort: dubbo
  selector:
    app.kubernetes.io/name: mdyaipay-accounting
    app.kubernetes.io/instance: "1"
---
