apiVersion: apps/v1
kind: Deployment
metadata:
  name: mdyaipay-finance-mock-1
  namespace: mdyaipay
  labels:
    app.kubernetes.io/name: mdyaipay-finance-mock
    app.kubernetes.io/instance: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mdyaipay-finance-mock
      app.kubernetes.io/instance: "1"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mdyaipay-finance-mock
        app.kubernetes.io/instance: "1"
        app.kubernetes.io/part-of: mdyaipay
        app.kubernetes.io/component: finance-channel
    spec:
      containers:
        - name: finance-mock
          image: mdyaipay-finance-mock:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8097
          env:
            - name: FINANCE_MOCK_SERVER_PORT
              value: "8097"
          resources:
            requests:
              memory: 128Mi
              cpu: 25m
            limits:
              memory: 256Mi
              cpu: "1"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 90
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: mdyaipay-finance-mock-1
  namespace: mdyaipay
  annotations:
    mdyaipay.dev/exposure: docker-desktop-loadbalancer
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 8097
      targetPort: http
  selector:
    app.kubernetes.io/name: mdyaipay-finance-mock
    app.kubernetes.io/instance: "1"
---
