apiVersion: apps/v1
kind: Deployment
metadata:
  name: mdyaipay-finance-gateway-1
  namespace: mdyaipay
  labels:
    app.kubernetes.io/name: mdyaipay-finance-gateway
    app.kubernetes.io/instance: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mdyaipay-finance-gateway
      app.kubernetes.io/instance: "1"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mdyaipay-finance-gateway
        app.kubernetes.io/instance: "1"
        app.kubernetes.io/part-of: mdyaipay
        app.kubernetes.io/component: finance-channel
    spec:
      containers:
        - name: finance-gateway
          image: mdyaipay-finance-gateway:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8087
            - name: dubbo
              containerPort: 20887
          env:
            - name: FINANCE_GATEWAY_SERVER_PORT
              value: "8087"
            - name: FINANCE_GATEWAY_CHANNEL_BASE_URL
              value: http://mdyaipay-finance-mock-1.mdyaipay.svc.cluster.local:8097
            - name: DUBBO_PORT
              value: "20887"
            - name: DUBBO_REGISTRY_ADDRESS
              value: zookeeper://zookeeper.mdyaipay-infra.svc.cluster.local:2181
            - name: DUBBO_IP_TO_REGISTRY
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: DUBBO_PROTOCOL_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          resources:
            requests:
              memory: 256Mi
              cpu: 50m
            limits:
              memory: 448Mi
              cpu: "1"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 120
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: mdyaipay-finance-gateway-1
  namespace: mdyaipay
  annotations:
    mdyaipay.dev/exposure: docker-desktop-loadbalancer
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 8087
      targetPort: http
    - name: dubbo
      port: 20887
      targetPort: dubbo
  selector:
    app.kubernetes.io/name: mdyaipay-finance-gateway
    app.kubernetes.io/instance: "1"
---
