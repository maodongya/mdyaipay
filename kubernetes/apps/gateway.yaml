apiVersion: apps/v1
kind: Deployment
metadata:
  name: mdyaipay-gateway-1
  namespace: mdyaipay
  labels:
    app.kubernetes.io/name: mdyaipay-gateway
    app.kubernetes.io/instance: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mdyaipay-gateway
      app.kubernetes.io/instance: "1"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mdyaipay-gateway
        app.kubernetes.io/instance: "1"
        app.kubernetes.io/part-of: mdyaipay
        app.kubernetes.io/component: app
    spec:
      containers:
        - name: gateway
          image: mdyaipay-gateway:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8041
          env:
            - name: MDYAIPAY_RATELIMIT_REDIS_URI
              value: redis://redis7.mdyaipay-infra.svc.cluster.local:6379
            - name: MDYAIPAY_GATEWAY_PORT
              value: "8041"
            - name: DUBBO_REGISTRY_ADDRESS
              value: zookeeper://zookeeper.mdyaipay-infra.svc.cluster.local:2181
            - name: DUBBO_IP_TO_REGISTRY
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: MDYAIPAY_SENTINEL_DASHBOARD
              value: sentinel-dashboard.mdyaipay.svc.cluster.local:8858
            - name: MDYAIPAY_SENTINEL_TRANSPORT_PORT
              value: "8719"
          resources:
            requests:
              memory: 384Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: "1"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 90
            periodSeconds: 5
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 180
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: mdyaipay-gateway-1
  namespace: mdyaipay
  annotations:
    mdyaipay.dev/exposure: docker-desktop-loadbalancer
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 8041
      targetPort: http
  selector:
    app.kubernetes.io/name: mdyaipay-gateway
    app.kubernetes.io/instance: "1"
---
