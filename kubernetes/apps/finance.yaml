apiVersion: apps/v1
kind: Deployment
metadata:
  name: mdyaipay-finance-1
  namespace: mdyaipay
  labels:
    app.kubernetes.io/name: mdyaipay-finance
    app.kubernetes.io/instance: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mdyaipay-finance
      app.kubernetes.io/instance: "1"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mdyaipay-finance
        app.kubernetes.io/instance: "1"
        app.kubernetes.io/part-of: mdyaipay
        app.kubernetes.io/component: app
    spec:
      containers:
        - name: finance
          image: mdyaipay-finance:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8090
            - name: dubbo
              containerPort: 20890
          env:
            - name: FINANCE_SERVER_PORT
              value: "8090"
            - name: FINANCE_JDBC_URL
              value: jdbc:mysql://mysql8.mdyaipay-infra.svc.cluster.local:3306/mdyaipay_finance?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
            - name: FINANCE_JDBC_USER
              value: root
            - name: FINANCE_JDBC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mdyaipay-jdbc
                  key: FINANCE_JDBC_PASSWORD
            - name: FINANCE_JDBC_INIT_SCHEMA
              value: "true"
            - name: DUBBO_PORT
              value: "20890"
            - name: DUBBO_REGISTRY_ADDRESS
              value: zookeeper://zookeeper.mdyaipay-infra.svc.cluster.local:2181
            - name: DUBBO_IP_TO_REGISTRY
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: DUBBO_PROTOCOL_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: FINANCE_ID_WORKER_ID
              value: "6"
          resources:
            requests:
              memory: 256Mi
              cpu: 50m
            limits:
              memory: 448Mi
              cpu: "1"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 90
            periodSeconds: 5
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 180
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: mdyaipay-finance-1
  namespace: mdyaipay
  annotations:
    mdyaipay.dev/exposure: docker-desktop-loadbalancer
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 8091
      targetPort: http
    - name: dubbo
      port: 20890
      targetPort: dubbo
  selector:
    app.kubernetes.io/name: mdyaipay-finance
    app.kubernetes.io/instance: "1"
---
