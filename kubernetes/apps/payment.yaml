apiVersion: apps/v1
kind: Deployment
metadata:
  name: mdyaipay-payment-1
  namespace: mdyaipay
  labels:
    app.kubernetes.io/name: mdyaipay-payment
    app.kubernetes.io/instance: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mdyaipay-payment
      app.kubernetes.io/instance: "1"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mdyaipay-payment
        app.kubernetes.io/instance: "1"
        app.kubernetes.io/part-of: mdyaipay
        app.kubernetes.io/component: app
    spec:
      containers:
        - name: payment
          image: mdyaipay-payment:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
            - name: dubbo
              containerPort: 20881
          env:
            - name: MDYAIPAY_RATELIMIT_REDIS_URI
              value: redis://redis7.mdyaipay-infra.svc.cluster.local:6379
            - name: PAYMENT_SERVER_PORT
              value: "8081"
            - name: PAYMENT_JDBC_URL
              value: jdbc:mysql://mysql8.mdyaipay-infra.svc.cluster.local:3306/mdyaipay_payment?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
            - name: PAYMENT_JDBC_USER
              value: root
            - name: PAYMENT_JDBC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mdyaipay-jdbc
                  key: PAYMENT_JDBC_PASSWORD
            - name: DUBBO_PORT
              value: "20881"
            - name: DUBBO_REGISTRY_ADDRESS
              value: zookeeper://zookeeper.mdyaipay-infra.svc.cluster.local:2181
            - name: DUBBO_IP_TO_REGISTRY
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: DUBBO_PROTOCOL_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: MDYAIPAY_SENTINEL_DASHBOARD
              value: sentinel-dashboard.mdyaipay.svc.cluster.local:8858
            - name: PAYMENT_ID_WORKER_ID
              value: "2"
            - name: MDYAIPAY_SENTINEL_TRANSPORT_PORT
              value: "8723"
          resources:
            requests:
              memory: 384Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: "1"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 90
            periodSeconds: 5
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 180
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: mdyaipay-payment-1
  namespace: mdyaipay
  annotations:
    mdyaipay.dev/exposure: docker-desktop-loadbalancer
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 8081
      targetPort: http
    - name: dubbo
      port: 20881
      targetPort: dubbo
  selector:
    app.kubernetes.io/name: mdyaipay-payment
    app.kubernetes.io/instance: "1"
---
