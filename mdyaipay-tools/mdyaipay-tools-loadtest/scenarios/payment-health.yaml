name: payment-health
protocol: http
load:
  threads: 20
  durationSeconds: 20
  rampUpSeconds: 3
  thinkTimeMillis: 0
  targetRps: null
metrics:
  percentiles: [0.5, 0.9, 0.95, 0.99]
  warmupSeconds: 2
  recordErrors: true
  maxErrorSamples: 50
target:
  url: http://127.0.0.1:8081/actuator/health
  method: GET
  headers:
    Accept: application/json
  timeoutMillis: 5000
  expectStatus: [200]
report:
  formats: [console, json, markdown]
  outputDir: target/loadtest-reports
