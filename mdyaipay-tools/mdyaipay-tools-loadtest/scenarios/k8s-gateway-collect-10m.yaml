# Kubernetes 全栈：网关加密收单 10 分钟（贴近令牌桶 300/s，减少 429）
name: k8s-gateway-collect-10m
protocol: http
load:
  threads: 40
  durationSeconds: 600
  rampUpSeconds: 30
  thinkTimeMillis: 0
  targetRps: 280
metrics:
  percentiles: [0.5, 0.9, 0.95, 0.99]
  warmupSeconds: 15
  recordErrors: true
  maxErrorSamples: 100
target:
  url: http://127.0.0.1:8041/api/v1/payments/collect
  method: POST
  headers:
    Content-Type: application/json
  bodyMode: merchantEncryptedCollect
  merchantEncryptedCollect:
    credentialsFile: target/loadtest-merchant-credentials.json
    amount: 100
    channel: MOCK
    productType: QUICK_COLLECTION
    orderNoPrefix: K8S-10M-
  timeoutMillis: 20000
  expectStatus: [200]
report:
  formats: [console, json, markdown]
  outputDir: target/loadtest-reports
