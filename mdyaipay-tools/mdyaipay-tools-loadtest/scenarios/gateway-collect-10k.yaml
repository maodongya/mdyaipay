# 网关加密收单约 1 万笔：40 并发 × 约 80s 正式阶段（预热 5s 不计入）
name: gateway-collect-10k
protocol: http
load:
  threads: 40
  durationSeconds: 80
  rampUpSeconds: 10
  thinkTimeMillis: 0
  targetRps: null
metrics:
  percentiles: [0.5, 0.9, 0.95, 0.99]
  warmupSeconds: 5
  recordErrors: true
  maxErrorSamples: 50
target:
  url: http://127.0.0.1:8041/api/v1/payments/collect
  method: POST
  headers:
    Content-Type: application/json
  bodyMode: merchantEncryptedCollect
  merchantEncryptedCollect:
    credentialsFile: target/loadtest-merchant-credentials.json
    amount: 100
    channel: MOCK
    productType: QUICK_COLLECTION
    orderNoPrefix: LT-10K-
  timeoutMillis: 30000
  expectStatus: [200]
report:
  formats: [console, json, markdown]
  outputDir: target/loadtest-reports
