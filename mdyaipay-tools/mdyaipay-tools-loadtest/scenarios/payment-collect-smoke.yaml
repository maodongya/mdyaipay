# 本地冒烟：先运行 scripts/seed-loadtest-merchant.py，再本场景（或 run-payment-loadtest.sh）
name: payment-collect-smoke
protocol: http
load:
  threads: 10
  durationSeconds: 15
  rampUpSeconds: 3
  thinkTimeMillis: 0
  targetRps: null
metrics:
  percentiles: [0.5, 0.9, 0.99]
  warmupSeconds: 2
  recordErrors: true
  maxErrorSamples: 20
target:
  url: http://127.0.0.1:8041/api/v1/payments/collect
  method: POST
  headers:
    Content-Type: application/json
  bodyMode: merchantEncryptedCollect
  merchantEncryptedCollect:
    # 凭证：scripts/seed-loadtest-merchant.py 写入仓库根 target/loadtest-merchant-credentials.json
    credentialsFile: target/loadtest-merchant-credentials.json
    amount: 100
    channel: MOCK
    productType: QUICK_COLLECTION
    orderNoPrefix: LT-SMOKE-
  timeoutMillis: 15000
  expectStatus: [200]
report:
  formats: [console, json]
  outputDir: target/loadtest-reports
