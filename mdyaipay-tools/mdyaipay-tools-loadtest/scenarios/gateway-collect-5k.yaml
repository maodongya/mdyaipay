# 网关加密收单约 5 千笔：35 并发、约 36s 正式阶段（含 SkyWalking Agent 时本机 ~140 TPS）
name: gateway-collect-5k
protocol: http
load:
  threads: 35
  durationSeconds: 36
  rampUpSeconds: 5
  thinkTimeMillis: 0
  targetRps: null
metrics:
  percentiles: [0.5, 0.9, 0.95, 0.99]
  warmupSeconds: 3
  recordErrors: true
  maxErrorSamples: 30
target:
  url: http://127.0.0.1:8041/api/v1/payments/collect
  method: POST
  headers:
    Content-Type: application/json
  bodyMode: merchantEncryptedCollect
  merchantEncryptedCollect:
    credentialsFile: target/loadtest-merchant-credentials.json
    amount: 100
    channel: MOCK
    productType: QUICK_COLLECTION
    orderNoPrefix: LT-5K-
  timeoutMillis: 15000
  expectStatus: [200]
report:
  formats: [console, json, markdown]
  outputDir: target/loadtest-reports
