# 对外模式：经网关加密收单。运行前请设置：
#   LOADTEST_MERCHANT_APP_KEY / LOADTEST_MERCHANT_APP_SECRET / LOADTEST_MERCHANT_ID
# （由 user 模块 issueApiCredential 签发，商户须 ENABLED）
name: gateway-collect
protocol: http
load:
  threads: 25
  durationSeconds: 30
  rampUpSeconds: 5
  thinkTimeMillis: 0
  targetRps: null
metrics:
  percentiles: [0.5, 0.9, 0.95, 0.99]
  warmupSeconds: 3
  recordErrors: true
  maxErrorSamples: 50
target:
  url: http://127.0.0.1:8041/api/v1/payments/collect
  method: POST
  headers:
    Content-Type: application/json
  bodyMode: merchantEncryptedCollect
  merchantEncryptedCollect:
    amount: 100
    channel: MOCK
    productType: QUICK_COLLECTION
    orderNoPrefix: LT-GW-
  timeoutMillis: 10000
  expectStatus: [200]
report:
  formats: [console, json, markdown]
  outputDir: target/loadtest-reports
