# Grafana：网关 collect 5 分钟（限流 + Sentinel 面板）
name: gateway-grafana-5m-collect
protocol: http
load:
  threads: 30
  durationSeconds: 300
  rampUpSeconds: 15
  thinkTimeMillis: 0
  targetRps: null
metrics:
  percentiles: [0.5, 0.9, 0.95, 0.99]
  warmupSeconds: 10
  recordErrors: true
  maxErrorSamples: 100
target:
  url: http://127.0.0.1:8041/api/v1/payments/collect
  method: POST
  headers:
    Content-Type: application/json
  bodyMode: merchantEncryptedCollect
  merchantEncryptedCollect:
    credentialsFile: target/loadtest-merchant-credentials.json
    amount: 100
    channel: MOCK
    productType: QUICK_COLLECTION
    orderNoPrefix: LT-G5M-
  timeoutMillis: 15000
  expectStatus: [200]
report:
  formats: [console, json, markdown]
  outputDir: target/loadtest-reports
