name: gateway-ids-next
protocol: http
load:
  threads: 30
  durationSeconds: 30
  rampUpSeconds: 5
  thinkTimeMillis: 0
  targetRps: null
metrics:
  percentiles: [0.5, 0.9, 0.95, 0.99]
  warmupSeconds: 3
  recordErrors: true
  maxErrorSamples: 50
target:
  url: http://127.0.0.1:8041/api/v1/ids/next
  method: GET
  headers:
    Accept: application/json
  timeoutMillis: 5000
  expectStatus: [200]
report:
  formats: [console, json, markdown]
  outputDir: target/loadtest-reports
