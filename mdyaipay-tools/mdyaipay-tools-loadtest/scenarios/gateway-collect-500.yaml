# 网关加密收单约 500 笔：50 RPS × 10s 正式阶段（预热 2s 不计入报告）
name: gateway-collect-500
protocol: http
load:
  threads: 30
  durationSeconds: 55
  rampUpSeconds: 2
  thinkTimeMillis: 0
  targetRps: 50
metrics:
  percentiles: [0.5, 0.9, 0.99]
  warmupSeconds: 2
  recordErrors: true
  maxErrorSamples: 30
target:
  url: http://127.0.0.1:8041/api/v1/payments/collect
  method: POST
  headers:
    Content-Type: application/json
  bodyMode: merchantEncryptedCollect
  merchantEncryptedCollect:
    credentialsFile: target/loadtest-merchant-credentials.json
    amount: 100
    channel: MOCK
    productType: QUICK_COLLECTION
    orderNoPrefix: LT-500-
  timeoutMillis: 30000
  expectStatus: [200]
report:
  formats: [console, json]
  outputDir: target/loadtest-reports
